<!DOCTYPE html>
<html>
<head>
  <title>Пример подключения плеера</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="normalize.css">
  <link rel="stylesheet" href="font-awesome-4.7.0\css\font-awesome.min.css">
  <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
  <link rel="shortcut icon" href="favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
  <link rel="manifest" href="favicon/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    .wonder-player {
      display: flex;
      flex-direction: column;
      width: 1000px;
      height: 750px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 1);
    }
    .wonder-player .screen {
      flex-grow: 1;
    }
    .wonder-player .bottom-controls {
      display: flex;
      background-color: black;
    }
    .wonder-player .left-buttons {
      display: flex;
    }
    .wonder-player .right-buttons {
      display: flex;
    }
    .wonder-player .viewing-panel {
      display: flex;
      flex-grow: 1;
      align-items: center;
    }
    .wonder-player .player-button {
      flex-grow: 0;
      border-style: none;
      cursor: pointer;
      background-color: rgb(0, 0, 0, 0);
      height: 55px;
      width: 45px;
    }
    .wonder-player .player-button:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(220, 66, 66, 0.5);
    }
    .wonder-player .btn-icon {
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: x-large;
    }
    .wonder-player .viewing-time {
      color: white;
      font-family: "Roboto", sans-serif;
      font-size: larger;
    }
    .wonder-player .viewing-progressbar {
      height: 6px;
      display: flex;
      flex-grow: 1;
      margin-left: 18px;
      margin-right: 18px;
      border-radius: 5px;
      background-color: grey;
    }
    .wonder-player .viewing-progressbar--slider {
      border-radius: 5px;
      background-color: red; 
    }
    .wonder-player .cirle {
      display: flex;
      align-items: center;
      margin: -8px;
      cursor: pointer;
    }
    .wonder-player .dot {
      height: 9px;
      width: 9px;
      background-color: red;
      border-radius: 50%;
      border-style: solid;
      border-width: 4px;
      border-color: white;
      display: inline-block;
      box-shadow: 0 0 20px rgba(0, 0, 0, 1);
      opacity: 0;
      transition-property: opacity;
      transition-duration: 300ms;
      transition-timing-function: ease-in-out;
    }
    .bottom-controls:hover .dot {
      opacity: 100;
    }
  </style>
</head>
<body>
  <div id="player" class="wonder-player">   <!-- Плеер -->
    <div class="js-video-container screen"></div>
    <div class="bottom-controls">
      <div class="left-buttons">   <!-- Левые кнопки -->
        <div class="play-button">
          <button class="js-play-button player-button">
            <i class="fa fa-play btn-icon" aria-hidden="true"></i>
          </button>
          <button class="js-pause-button player-button">
            <i class="fa fa-pause btn-icon" aria-hidden="true"></i>
          </button>
        </div>
        <div class="volume-button">
          <button class="js-volume-button player-button">
            <i class="fa fa-volume-off btn-icon" aria-hidden="true"></i>
          </button>
          <button class="js-mute-button player-button">
            <i class="fa fa-volume-up btn-icon" aria-hidden="true"></i>
          </button>
        </div>
      </div>
      <div class="viewing-panel">   <!-- Панель прогресса -->
        <div class="viewing-time">
          <span class="js-current-time"></span>
        </div>
        <div class="js-progress viewing-progressbar">
          <div class="js-progress-slider viewing-progressbar--slider"></div>
          <div class="cirle">
            <span class="dot"></span>
          </div>
        </div>
        <div class="video-duration viewing-time">
          <span class="js-duration"></span>
        </div>
      </div>
      <div class="right-buttons">   <!-- Правые кнопки -->
        <div class="fullscreen-button">
          <button class="js-fullscreen-button player-button">
            <i class="fa fa-arrows-alt btn-icon" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
  <script src="https://unpkg.com/playable@2.10.3/dist/statics/playable.bundle.min.js"></script>
  <script src="player.js"></script>

  <script type="text/javascript">
    createPlayer({elementId: 'player'});
  </script>
</body>
</html>
