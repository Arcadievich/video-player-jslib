<!DOCTYPE html>
<html lang="en">
<head>
  <title>Пример подключения плеера</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="normalize.css">
  <link rel="stylesheet" href="font-awesome-4.7.0/css/font-awesome.min.css">
  <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg">
  <link rel="shortcut icon" href="favicon/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="manifest" href="favicon/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="wonder-player.css">
</head>
<body>
  <div id="player" class="wonder-player">   <!-- Плеер -->
    <div class="js-video-container screen"></div>
    <div class="bottom-controls">
      <div class="left-buttons">   <!-- Левые кнопки -->
        <div class="play-button">
          <button class="js-play-button player-button">
            <i class="fa fa-play btn-icon" aria-hidden="true"></i>
          </button>
          <button class="js-pause-button player-button">
            <i class="fa fa-pause btn-icon" aria-hidden="true"></i>
          </button>
        </div>
        <div class="volume-button">
          <button class="js-volume-button player-button">
            <i class="fa fa-volume-off btn-icon" aria-hidden="true"></i>
          </button>
          <button class="js-mute-button player-button">
            <i class="fa fa-volume-up btn-icon" aria-hidden="true"></i>
          </button>
        </div>
      </div>
      <div class="viewing-panel">   <!-- Панель прогресса -->
        <div class="viewing-time">
          <span class="js-current-time"></span>
        </div>
        <div class="js-progress viewing-progressbar">
          <div class="js-progress-slider viewing-progressbar--slider"></div>
          <div class="cirle">
            <span class="dot"></span>
          </div>
        </div>
        <div class="video-duration viewing-time">
          <span class="js-duration"></span>
        </div>
      </div>
      <div class="right-buttons">   <!-- Правые кнопки -->
        <div class="fullscreen-button">
          <button class="js-fullscreen-button player-button">
            <i class="fa fa-arrows-alt btn-icon" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
  <script src="https://unpkg.com/playable@2.10.3/dist/statics/playable.bundle.min.js"></script>
  <script src="player.js"></script>

  <script>
    createPlayer({elementId: 'player'});
  </script>
</body>
</html>
